# GitHub Pages 미리보기 배포
#
# ⚠️ 임시 워크플로다. 정적 페이지만 올릴 수 있으므로 Phase 2~3에서
# 예약 기능(Supabase, 서버 계산)이 붙으면 동작하지 않는다.
# 그때 이 파일과 next.config.ts의 STATIC_EXPORT 분기를 함께 지운다.

name: Deploy preview to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: 테스트
        run: npm test

      - name: 정적 빌드
        run: npm run build
        env:
          STATIC_EXPORT: "1"

      - name: Jekyll 처리 비활성화
        run: touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
